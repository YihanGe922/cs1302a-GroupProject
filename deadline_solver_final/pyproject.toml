[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deadline-conflict-solver-merged-demo"
version = "0.1.0"
description = "Assignment scheduling, conflict analysis, and extra-time scenarios with interactive input"
readme = "README.md"
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/YihanGe922/cs1302a-GroupProject"
Repository = "https://github.com/YihanGe922/cs1302a-GroupProject"

[project.scripts]
deadline-solver = "deadline_conflict_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
