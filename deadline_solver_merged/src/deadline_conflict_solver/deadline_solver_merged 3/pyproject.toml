[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deadline-conflict-solver-merged-demo"
version = "0.1.0"
description = "Educational merged deadline conflict solver with interactive input"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
deadline-solver = "deadline_conflict_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
